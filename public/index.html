<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAV 主频轨迹浏览器</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="row"><label class="file"><input id="file" type="file" accept=".wav,audio/wav">载入 WAV</label><span id="status">等待音频…</span><span id="meta"></span></div><div class="row controls"><label><input id="noteLines" type="checkbox"> 十二平均律标线</label><label><input id="sampled" type="checkbox" checked> 采样音轨</label><label><input id="beatLines" type="checkbox"> 节拍线</label><label><input id="beatNotes" type="checkbox" checked> 节拍音符</label><label><input id="dismiss" type="checkbox"> 音符取消按钮</label><label>BPM <input id="bpm" type="number" min="30" max="300" value="120"></label><label>拍号 <select id="meter"><option>3/4</option><option selected>4/4</option><option>5/4</option><option>6/4</option></select></label><label>播放轨迹 <select id="track"><option value="max">最大值（红线）</option><option value="s1">采样音轨 #1</option><option value="s2">采样音轨 #2</option><option value="s3">采样音轨 #3</option><option value="original">原音</option><option value="notes">节拍音符</option></select></label><label><input id="fromStart" type="checkbox" checked> 每次从头播放</label><button id="play">播放合成音</button><button id="reset">重置视图</button></div></header><main><canvas id="plot"></canvas><div class="hint">拖动平移 · 滚轮缩放 · Ctrl+点击设置播放位置 · 点击顶部节拍音符修改 · Shift+点击消除</div></main><script type="module" src="/app.js"></script></body></html>
