name: Deploy GitHub Pages

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/vendor
          cp -R public/. _site/
          curl -fsSL https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js -o _site/vendor/vue-2.7.16.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js#/vendor/vue-2.7.16.min.js#' _site/index.html
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
